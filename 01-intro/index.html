<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이웅서 소개</title>
  <style>
    * { box-sizing: border-box; }

    body {
      --background: #101010;
      margin: 0;
      background-color: var(--background);
      color: #fff8e9;
      font-family: "Malgun Gothic", system-ui, sans-serif;
      transition: background-color 250ms ease;
    }

    body[data-theme="navy"] { --background: #11234a; }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: clamp(2rem, 8vw, 8rem);
      background-image: linear-gradient(125deg, transparent 46%, #b98d462d 68%, transparent 84%);
    }

    .profile {
      width: min(34rem, 100%);
      padding: clamp(1.25rem, 4vw, 3rem);
      background: #111418ef;
      border: 1px solid #766347;
      border-top: 3px solid #e9bf73;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 7vw, 5.5rem);
      line-height: 1.1;
      letter-spacing: -.07em;
    }

    .intro { color: #e9dfd0; line-height: 1.8; }
    h2 { margin: 2rem 0 .75rem; font-size: 1.125rem; color: #f0c87e; }

    ul {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .65rem;
      margin: 0 0 2rem;
      padding: 0;
      list-style: none;
    }

    li {
      padding: .65rem .75rem;
      border-left: 2px solid #ad8649;
      background: #ffffff0c;
      line-height: 1.5;
    }

    button {
      min-height: 44px;
      padding: .65rem 1rem;
      border: 1px solid #efc77d;
      background: #efc77d;
      color: #19130a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #ffe2a7; }
    button:focus-visible { outline: 2px solid white; outline-offset: 4px; }

    .decoration {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: -2rem;
      width: min(48vw, 43rem);
      aspect-ratio: 1.1;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .note, .bar { position: absolute; }

    .note {
      width: 63%;
      height: 31%;
      display: grid;
      place-items: center;
      border: .35rem double #8b9a70;
      background: repeating-linear-gradient(135deg, #2b3b30 0 3px, #334634 3px 6px);
      color: #d8e2b9;
      box-shadow: 0 .55rem 0 #1d2920, 0 1rem 2rem #0009;
      letter-spacing: .14em;
      font-size: clamp(.55rem, 1.25vw, 1rem);
    }

    .note::before {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid #8b9a70;
      border-radius: 40%;
    }

    .note-back { top: 13%; left: 27%; transform: rotate(-23deg); }
    .note-front { top: 32%; left: 17%; transform: rotate(10deg); }

    .bar {
      width: 58%;
      height: 22%;
      display: grid;
      place-items: center;
      clip-path: polygon(12% 0, 93% 0, 100% 76%, 94% 100%, 0 100%, 2% 77%);
      background: linear-gradient(180deg, #f5d489 0%, #a26823 43%, #f6d07a 75%, #714514 77%, #b78336 100%);
      color: #392306;
      font-size: clamp(.65rem, 1.6vw, 1.25rem);
      font-weight: 800;
      letter-spacing: .25em;
    }

    .bar-back { top: 61%; left: 29%; transform: rotate(12deg); }
    .bar-front { top: 72%; left: 6%; transform: rotate(-13deg); }

    @media (max-width: 760px) {
      .page { align-items: start; padding-bottom: 0; }
      .decoration {
        position: relative;
        top: auto;
        right: auto;
        justify-self: end;
        width: min(100%, 25rem);
        transform: none;
      }
    }

    @media (max-width: 380px) {
      ul { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
    .profile { position: relative; z-index: 2; }
    .controls { display: flex; flex-wrap: wrap; gap: .65rem; }

    .motion-toggle {
      background: #14171c;
      color: #ffe3a8;
    }

    .motion-toggle:hover { background: #333039; }

      inset: 50% -60% -12%;

      0% { transform: translate(-120%, -12%) scale(.65); opacity: 0; filter: blur(5px); }
      13% { opacity: 1; filter: blur(0); }
      35% { transform: translate(0, 4%) scale(1); opacity: 1; filter: blur(0); }

    @keyframes overtake {

    @keyframes road {

      to { transform: translateX(-20%); }

      <div class="note note-front" aria-hidden="true">가상 지폐</div>

  </main>

  <script>
    const race = document.querySelector('.race');
    const motionButton = document.querySelector('#toggle-motion');

    function setMotion(isPlaying) {
      race.dataset.motion = isPlaying ? 'on' : 'off';
      motionButton.textContent = isPlaying ? '움직임 멈추기' : '움직임 재생';
    }

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    setMotion(!reducedMotion.matches);
    reducedMotion.addEventListener('change', (event) => setMotion(!event.matches));
    motionButton.addEventListener('click', () => setMotion(race.dataset.motion !== 'on'));

    const themeButton = document.querySelector('#change-theme');

    themeButton.addEventListener('click', () => {
      const useNavy = document.body.dataset.theme === 'black';
      document.body.dataset.theme = useNavy ? 'navy' : 'black';
      themeButton.setAttribute('aria-pressed', String(useNavy));
    });
  </script>
