[project]
name = "workspace2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "matplotlib>=3.11.2",
    "openai>=3.50.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qrcode>=8.2",
    "requests",
    "seaborn>=0.13.2",
    "wordcloud>=1.9.6",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
workspace2 = "workspace2:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
